<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén Pro – Gestión comercial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--sf:#fff;--ink:#16221f;--mut:#63726e;--ln:#dce3e0;--br:#0b5563;--brt:#fff;--ac:#f2b705;--ok:#1b7f4b;--wn:#b36b00;--er:#c23b3b;--sh:#e7efed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1816;--sf:#17221f;--ink:#e8efed;--mut:#93a5a0;--ln:#2a3a36;--br:#4fb3c4;--brt:#06242a;--ok:#4cc58a;--wn:#f0b04a;--er:#ef7b7b;--sh:#1e2d29}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1816;--sf:#17221f;--ink:#e8efed;--mut:#93a5a0;--ln:#2a3a36;--br:#4fb3c4;--brt:#06242a;--ok:#4cc58a;--wn:#f0b04a;--er:#ef7b7b;--sh:#1e2d29}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--br);color:var(--brt);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside h1{font-size:19px;margin:0 8px 16px;letter-spacing:-.3px}aside h1 span{background:var(--ac);color:#16221f;border-radius:5px;padding:0 6px;margin-right:6px}
aside button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;font-weight:500;opacity:.85}
aside button:hover,aside button.on{background:rgba(255,255,255,.16);opacity:1}aside button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:20px;min-width:0}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.top h2{margin:0;font-size:24px;letter-spacing:-.4px;flex:1;min-width:140px}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;min-height:40px;max-width:100%}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 14px;min-height:40px;background:var(--br);color:var(--brt);cursor:pointer}
.btn.g{background:var(--sh);color:var(--ink)}.btn.a{background:var(--ac);color:#16221f}.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}.card h3{margin:0 0 10px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kp div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}.kp b{display:block;font-size:24px;letter-spacing:-.5px}.kp small{color:var(--mut)}
.kp div.hero{background:var(--br);color:var(--brt);border:0}.kp div.hero small{color:inherit;opacity:.8}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.fl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bd{border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sh)}.bd.ok{color:var(--ok)}.bd.wn{color:var(--wn)}.bd.er{color:var(--er)}
.pgr{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.frm label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar i{display:block;height:14px;background:var(--br);border-radius:4px}.bar span:first-child{width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.pg button{all:unset;cursor:pointer;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;min-height:76px}.pg button:hover{border-color:var(--br)}.pg b{display:block;color:var(--br);margin-top:4px}.pg small{color:var(--mut)}
.ci{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln)}.ci div:first-child{flex:1;min-width:0}
.q{display:flex;gap:4px;align-items:center}.q button{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--sh);color:var(--ink);font-size:18px;cursor:pointer}
.tot{font-size:26px;font-weight:700;display:flex;justify-content:space-between;margin:10px 0}
dialog{border:0;border-radius:14px;background:var(--sf);color:var(--ink);padding:18px;max-width:94vw}dialog::backdrop{background:rgba(0,0,0,.5)}
pre.tk{font:12px/1.3 "Courier New",monospace;width:32ch;margin:0 auto 12px;background:#fff;color:#000;padding:8px;border:1px dashed #999;white-space:pre}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
#tkp{display:none}
@media(max-width:860px){.app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:14px 14px 0 0}aside h1{display:none}aside button{white-space:nowrap;padding:10px 12px}main{padding:14px 12px 90px}.g2,.g3{grid-template-columns:1fr}}
@media print{.app,#toast,dialog{display:none!important}body.pt #tkp{display:block}body.pt{background:#fff}body:not(.pt) .app{display:block!important}body:not(.pt) aside,body:not(.pt) .noprint{display:none!important}body:not(.pt) .app{display:block}}
#tkp pre{font:11px/1.25 "Courier New",monospace;width:48mm;margin:0;color:#000}
</style></head><body>
<div class="app"><aside id="nav"></aside><main><div class="top"><h2 id="ttl"></h2>
<select id="role" aria-label="Rol"><option>Administrador</option><option>Almacenero</option><option>Cajero</option></select>
<select id="wsel" aria-label="Almacén"></select></div><div id="main"></div></main></div>
<div id="tkp"><pre id="tkpre"></pre></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),f2=n=>(+n).toFixed(2),M=n=>'S/ '+f2(n),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toISOString().slice(0,10),addD=n=>iso(new Date(Date.now()+n*864e5)),now=()=>new Date().toLocaleString('es-PE');
let sd=7;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
const CATS=['Abarrotes','Bebidas','Lácteos','Limpieza','Snacks','Cuidado personal'];
const P0=`Arroz extra 1 kg|0|Costeño|kg|3.6;Azúcar rubia 1 kg|0|Cartavio|kg|3.4;Aceite vegetal 1 L|0|Primor|L|9.2;Fideos spaghetti 500 g|0|Don Vittorio|und|2.8;Atún en agua 170 g|0|Florida|und|4.9;Harina de trigo 1 kg|0|Molitalia|kg|3.9;Gaseosa cola 1.5 L|1|Inca Kola|und|5.5;Agua mineral 625 ml|1|San Luis|und|1.5;Jugo de naranja 1 L|1|Frugos|und|4.2;Cerveza lager 620 ml|1|Cusqueña|und|6.8;Energizante 473 ml|1|Volt|und|3.6;Té helado 500 ml|1|Lipton|und|2.9;Leche entera 1 L|2|Gloria|und|4.6;Yogurt fresa 1 L|2|Laive|und|6.3;Queso fresco 250 g|2|Bonlé|und|7.8;Mantequilla 200 g|2|Gloria|und|6.4;Leche evaporada 400 g|2|Ideal|und|3.9;Detergente 800 g|3|Bolívar|und|9.9;Lejía 1 L|3|Clorox|und|3.8;Lavavajilla 500 ml|3|Sapolio|und|4.4;Papel higiénico x4|3|Elite|pack|6.5;Esponja multiuso|3|Scotch|und|1.9;Papas fritas 150 g|4|Lay's|und|4.8;Galletas soda x6|4|Field|pack|2.9;Chocolate 90 g|4|Sublime|und|2.4;Maní salado 200 g|4|Karinto|und|3.7;Shampoo 400 ml|5|Head&amp;Shoulders|und|15.9;Jabón de tocador x3|5|Dove|pack|8.9;Pasta dental 100 ml|5|Colgate|und|5.9;Desodorante 150 ml|5|Rexona|und|11.5`;
const db={prods:[],sups:[{id:1,ruc:'20512345671',name:'Distribuidora Andina SAC',ct:'Rosa Quispe · 987 654 321',cats:[0,3]},{id:2,ruc:'20498765432',name:'Bebidas del Oriente SRL',ct:'Luis Paredes · 965 123 456',cats:[1,4]},{id:3,ruc:'20601234567',name:'Lácteos y Cuidado EIRL',ct:'Ana Vega · 944 222 111',cats:[2,5]}],
whs:[{id:1,name:'Almacén Central'},{id:2,name:'Sucursal Norte'}],stock:{},avg:{},lots:[],kdx:[],pos:[],sales:[],log:[],nb:1,nf:1};
P0.split(';').forEach((r,i)=>{const [n,c,b,u,pc]=r.split('|');const pcn=+pc,pv=Math.round(pcn*1.32*10)/10;db.prods.push({id:i+1,sku:'SKU-'+String(i+1).padStart(4,'0'),bc:'775'+String(1000000000+i*7919),name:n.replace('&amp;','&'),cat:+c,brand:b.replace('&amp;','&'),unit:u,pc:pcn,pv,min:10,max:80,on:true,img:''});});
let role='Administrador',wh=1,S={v:'dash',pg:{},q:{}},cart=[],oc={sup:1,lines:[]};
const user=()=>role;
function log(a){db.log.unshift({d:now(),u:role,a})}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const tq=p=>db.whs.reduce((s,w)=>s+(db.stock[p+'|'+w.id]||0),0),st=(p,w)=>db.stock[p+'|'+w]||0;
function move(p,w,type,q,cost,ref,reason,lot,exp){q=+q;if(!(q>0))throw Error('La cantidad debe ser mayor a 0');const k=p+'|'+w,cur=st(p,w),sg=['IN','AJU+','TRF+'].includes(type)?1:-1;
 if(cur+sg*q<0)throw Error('Stock insuficiente de '+pn(p)+' (disponible '+cur+')');
 if(sg>0){if(cost!=null&&type==='IN'){const t=tq(p);db.avg[p]=((t*(db.avg[p]||0))+q*cost)/(t+q)}db.lots.push({p,w,lot:lot||'L'+iso(new Date()).replace(/-/g,''),exp:exp||addD(180),q})}
 else{let r=q;db.lots.filter(l=>l.p===p&&l.w===w&&l.q>0).sort((a,b)=>a.exp<b.exp?-1:1).forEach(l=>{const t=Math.min(l.q,r);l.q-=t;r-=t})}
 db.stock[k]=cur+sg*q;const c=db.avg[p]||0;db.kdx.push({d:now(),p,w,type,q,c,bal:db.stock[k],val:db.stock[k]*c,ref:ref||'',reason:reason||'',user:user()})}
function tx(fn){const snap=structuredClone(db);try{fn()}catch(e){Object.keys(db).forEach(k=>delete db[k]);Object.assign(db,snap);throw e}}
const pn=id=>db.prods.find(p=>p.id===id)?.name||'?';
db.prods.forEach(p=>{db.avg[p.id]=p.pc;[1,2].forEach(w=>{const q=Math.floor((w===1?8+rnd()*60:3+rnd()*20));move(p.id,w,'IN',q,p.pc,'INICIAL','Inventario inicial','L2026-A',addD(p.id%7===0?12:60+Math.floor(rnd()*300)))})});
db.prods[2].min=30;db.stock['3|1']=6;db.kdx.push({d:now(),p:3,w:1,type:'AJU-',q:0,c:9.2,bal:6,val:55.2,ref:'AJ-001',reason:'Conteo físico',user:'Almacenero'});db.lots.filter(l=>l.p===3&&l.w===1).forEach(l=>l.q=6);
// ---------- UI helpers
function pager(key,rows,size,head,rowf,fn){const n=Math.max(1,Math.ceil(rows.length/size)),p=Math.min(S.pg[key]||1,n);S.pg[key]=p;
 return `<div class="fl"><table><thead><tr>${head.map(h=>`<th${h[0]=='#'?' class="n"':''}>${h.replace('#','')}</th>`).join('')}</tr></thead><tbody>${rows.slice((p-1)*size,p*size).map(rowf).join('')||`<tr><td colspan="${head.length}">Sin resultados. Cambia los filtros.</td></tr>`}</tbody></table></div><div class="pgr noprint"><span>${rows.length} registros</span><button class="btn g sm" ${p<2?'disabled':''} onclick="go('${key}',${p-1})">Anterior</button><span>${p} / ${n}</span><button class="btn g sm" ${p>=n?'disabled':''} onclick="go('${key}',${p+1})">Siguiente</button></div>`}
function go(k,p){S.pg[k]=p;V[S.v].list&&V[S.v].list()}
const opts=(a,sel)=>a.map(x=>`<option value="${x[0]}"${x[0]==sel?' selected':''}>${esc(x[1])}</option>`).join('');
const popts=()=>opts(db.prods.filter(p=>p.on).map(p=>[p.id,p.sku+' · '+p.name]));
function csv(name,rows){const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';a.click()}
const badge=p=>{const q=tq(p.id);return q<=0?'<span class="bd er">Agotado</span>':q<p.min?'<span class="bd wn">Stock bajo</span>':q>p.max?'<span class="bd">Exceso</span>':'<span class="bd ok">Normal</span>'}
const expiring=d=>db.lots.filter(l=>l.q>0&&l.exp<=addD(d)).sort((a,b)=>a.exp<b.exp?-1:1);
// ---------- Ticket 58 mm (32 caracteres)
const L=32,ln=(a,b)=>a+' '.repeat(Math.max(1,L-a.length-b.length))+b,ct=s=>' '.repeat(Math.max(0,(L-s.length)>>1))+s,hr='-'.repeat(L);
function ticket(s){const o=[ct('ALMACEN PRO S.A.C.'),ct('RUC 20555555551'),ct('Av. Principal 123'),hr,ct(s.doc==='Factura'?'FACTURA ELECTRONICA':'BOLETA DE VENTA'),ct(s.n),ln('Fecha:',s.date),ln('Cajero:',s.user),ln('Cliente:',s.cust||'Publico general'),hr];
 s.items.forEach(i=>{o.push(i.name.slice(0,L));o.push(ln(' '+i.q+' x '+f2(i.pv),f2(i.q*i.pv)))});o.push(hr);
 o.push(ln('Subtotal:',f2(s.sub)));if(s.disc)o.push(ln('Descuento:','-'+f2(s.disc)));o.push(ln('IGV 18%:',f2(s.igv)));o.push(ln('TOTAL S/:',f2(s.total)));o.push(hr,ln('Pago:',s.pay),'',ct('Gracias por su compra'));return o.join('\n')}
function showTicket(n){const s=db.sales.find(x=>x.n===n);$('#dlg').innerHTML=`<pre class="tk">${esc(ticket(s))}</pre><div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="printTk('${n}')">Imprimir 58 mm</button><button class="btn g" onclick="$('#dlg').close()">Cerrar</button></div>`;$('#dlg').showModal()}
function printTk(n){const s=db.sales.find(x=>x.n===n);$('#tkpre').textContent=ticket(s);const st=document.createElement('style');st.textContent='@page{size:58mm auto;margin:2mm}';document.head.append(st);document.body.classList.add('pt');window.print();document.body.classList.remove('pt');st.remove();log('Impresión/reimpresión '+n)}
// ---------- Vistas
const V={
dash:{t:'Panel general',html(){const hoy=db.sales.filter(s=>s.date.slice(0,9)===now().slice(0,9)),vt=hoy.reduce((a,s)=>a+s.total,0),ut=db.sales.reduce((a,s)=>a+s.profit,0),inv=db.prods.reduce((a,p)=>a+tq(p.id)*db.avg[p.id],0),low=db.prods.filter(p=>p.on&&tq(p.id)<p.min),ex=expiring(30);
 const top={};db.sales.forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=tp[0]?tp[0][1]:1;
 return `<div class="kp"><div class="hero"><small>Ventas de hoy</small><b>${M(vt)}</b></div><div><small>Utilidad bruta</small><b>${M(ut)}</b></div><div><small>Inventario valorizado</small><b>${M(inv)}</b></div><div><small>Alertas activas</small><b>${low.length+ex.length}</b></div></div>
 <div class="g2"><div class="card"><h3>Productos con stock bajo</h3>${low.map(p=>`<div class="bar"><span>${esc(p.name)}</span><b>${tq(p.id)}</b><small>mín. ${p.min}</small></div>`).join('')||'Todo el stock está sobre el mínimo.'}</div>
 <div class="card"><h3>Próximos a vencer (30 días)</h3>${ex.slice(0,8).map(l=>`<div class="bar"><span>${esc(pn(l.p))}</span><b>${l.exp}</b><small>${l.q} und · ${db.whs[l.w-1].name}</small></div>`).join('')||'Sin lotes por vencer.'}</div></div>
 <div class="g2"><div class="card"><h3>Productos más vendidos</h3>${tp.map(([n,q])=>`<div class="bar"><span>${esc(n)}</span><i style="width:${q/mx*60}%"></i><b>${q}</b></div>`).join('')||'Aún no hay ventas. Registra una en Punto de venta o usa la demostración.'}</div>
 <div class="card"><h3>Demostración guiada</h3><p style="color:var(--mut)">Ejecuta compra, recepción, venta y kardex del mismo producto en un solo paso.</p><button class="btn a" onclick="demo()">Ejecutar demostración</button></div></div>`}},
pos:{t:'Punto de venta',html(){return `<div class="g3"><div><input id="pq" placeholder="Buscar por nombre, SKU o código de barras" style="width:100%" oninput="V.pos.list()" autofocus><div class="pg" id="lst"></div></div>
 <div class="card"><h3>Venta actual</h3><div id="cart"></div><div class="frm" style="margin-top:10px"><label>Descuento %<input id="dc" type="number" min="0" max="100" value="0" oninput="V.pos.cart()"></label><label>Pago<select id="py"><option>Efectivo</option><option>Yape / Plin</option><option>Tarjeta</option></select></label></div>
 <label style="display:block;margin-top:10px;font-size:13px;color:var(--mut)">DNI o RUC (11 dígitos emite factura)<input id="cu" style="width:100%" inputmode="numeric" maxlength="11"></label>
 <div class="tot"><span>Total</span><span id="tt">S/ 0.00</span></div><div id="ig" style="color:var(--mut)"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn a" style="flex:1" onclick="sell()">Cobrar e imprimir</button><button class="btn g" onclick="cart=[];V.pos.cart()">Vaciar</button></div></div></div>`},
 list(){const q=($('#pq')?.value||'').toLowerCase();$('#lst').innerHTML=db.prods.filter(p=>p.on&&(p.name+p.sku+p.bc).toLowerCase().includes(q)).slice(0,12).map(p=>`<button onclick="addC(${p.id})"><small>${st(p.id,wh)} en stock</small><div>${esc(p.name)}</div><b>${M(p.pv)}</b></button>`).join('')||'Sin coincidencias.'},
 cart(){const c=$('#cart');if(!c)return;c.innerHTML=cart.map(i=>`<div class="ci"><div>${esc(pn(i.p))}<br><small style="color:var(--mut)">${M(db.prods[i.p-1].pv)} c/u</small></div><div class="q"><button onclick="qC(${i.p},-1)" aria-label="Menos">−</button><b>${i.q}</b><button onclick="qC(${i.p},1)" aria-label="Más">+</button></div></div>`).join('')||'<p style="color:var(--mut)">Toca un producto para agregarlo.</p>';const t=calc();$('#tt').textContent=M(t.total);$('#ig').textContent='Subtotal '+M(t.sub)+' · IGV '+M(t.igv)}},
prod:{t:'Productos',html(){return `<details class="card" id="pf"><summary><b id="pft">Nuevo producto</b></summary><div class="frm" style="margin-top:12px"><input type="hidden" id="f_id"><label>SKU<input id="f_sku"></label><label>Código de barras<input id="f_bc"></label><label>Nombre<input id="f_n"></label><label>Categoría<select id="f_c">${opts(CATS.map((c,i)=>[i,c]))}</select></label><label>Marca<input id="f_b"></label><label>Unidad<select id="f_u"><option>und</option><option>kg</option><option>L</option><option>pack</option></select></label><label>P. compra<input id="f_pc" type="number" step=".01"></label><label>P. venta<input id="f_pv" type="number" step=".01"></label><label>Stock mín.<input id="f_mi" type="number" value="10"></label><label>Stock máx.<input id="f_ma" type="number" value="80"></label><label>Imagen<input id="f_i" type="file" accept="image/*"></label><label>Estado<select id="f_s"><option value="1">Activo</option><option value="0">Inactivo</option></select></label><button class="btn" onclick="saveP()">Guardar producto</button></div></details>
 <div class="top"><input id="q1" placeholder="Buscar producto" oninput="S.pg.prod=1;V.prod.list()"><select id="c1" onchange="S.pg.prod=1;V.prod.list()"><option value="">Todas las categorías</option>${opts(CATS.map((c,i)=>[i,c]))}</select></div><div class="card" id="lst"></div>`},
 list(){const q=($('#q1').value||'').toLowerCase(),c=$('#c1').value;$('#lst').innerHTML=pager('prod',db.prods.filter(p=>(p.name+p.sku+p.bc+p.brand).toLowerCase().includes(q)&&(c===''||p.cat==c)),10,['','SKU','Producto','Categoría','#Compra','#Venta','#Stock','Estado',''],p=>`<tr><td>${p.img?`<img src="${p.img}" width="32" height="32" style="border-radius:6px;object-fit:cover" alt="">`:'📦'}</td><td>${p.sku}</td><td>${esc(p.name)}<br><small style="color:var(--mut)">${esc(p.brand)} · ${p.bc}</small></td><td>${CATS[p.cat]}</td><td class="n">${f2(p.pc)}</td><td class="n">${f2(p.pv)}</td><td class="n">${tq(p.id)} ${p.unit}</td><td>${p.on?badge(p):'<span class="bd">Inactivo</span>'}</td><td><button class="btn g sm" onclick="editP(${p.id})">Editar</button></td></tr>`)}},
inv:{t:'Inventario y almacenes',html(){return `<div class="card"><h3>Registrar movimiento</h3><div class="frm"><label>Tipo<select id="mt"><option value="AJU+">Ajuste (entrada)</option><option value="AJU-">Ajuste (salida)</option><option value="MERMA">Merma</option><option value="TRF">Transferencia a otro almacén</option></select></label><label>Producto<select id="mp">${popts()}</select></label><label>Cantidad<input id="mq" type="number" min="1" value="1"></label><label>Motivo<input id="mr" placeholder="Obligatorio"></label><button class="btn" onclick="doMove()">Registrar en almacén seleccionado</button></div></div>
 <div class="top"><input id="q1" placeholder="Buscar producto" oninput="S.pg.inv=1;V.inv.list()"></div><div class="card" id="lst"></div><div class="card"><h3>Lotes por vencer (60 días)</h3><div class="fl"><table><tr><th>Producto</th><th>Lote</th><th>Almacén</th><th>Vence</th><th class="n">Unid.</th></tr>${expiring(60).slice(0,10).map(l=>`<tr><td>${esc(pn(l.p))}</td><td>${l.lot}</td><td>${db.whs[l.w-1].name}</td><td>${l.exp}</td><td class="n">${l.q}</td></tr>`).join('')}</table></div></div>`},
 list(){const q=($('#q1').value||'').toLowerCase();$('#lst').innerHTML=pager('inv',db.prods.filter(p=>p.name.toLowerCase().includes(q)),8,['Producto','#Central','#Norte','#Mín.','#Máx.','Estado'],p=>`<tr><td>${esc(p.name)}</td><td class="n">${st(p.id,1)}</td><td class="n">${st(p.id,2)}</td><td class="n">${p.min}</td><td class="n">${p.max}</td><td>${badge(p)}</td></tr>`)}},
kdx:{t:'Kardex valorizado',html(){return `<div class="top"><select id="kp" onchange="S.pg.kdx=1;V.kdx.list()">${popts()}</select><button class="btn g" onclick="expK()">Excel (CSV)</button><button class="btn g" onclick="print()">PDF</button></div><div class="card" id="lst"></div>`},
 rows(){const p=+$('#kp').value;return db.kdx.filter(k=>k.p===p&&k.w===wh)},
 list(){const T={IN:'Entrada','AJU+':'Ajuste +','AJU-':'Ajuste −',OUT:'Salida',MERMA:'Merma','TRF+':'Transf. entrada','TRF-':'Transf. salida'};$('#lst').innerHTML=`<p style="margin-top:0;color:var(--mut)">${db.whs[wh-1].name} · método promedio ponderado</p>`+pager('kdx',this.rows().slice().reverse(),12,['Fecha','Tipo','Referencia','#Cantidad','#Costo','#Saldo','#Valor','Usuario'],k=>`<tr><td>${k.d}</td><td>${T[k.type]}<br><small style="color:var(--mut)">${esc(k.reason)}</small></td><td>${esc(k.ref)}</td><td class="n">${k.q}</td><td class="n">${f2(k.c)}</td><td class="n">${k.bal}</td><td class="n">${f2(k.val)}</td><td>${k.user}</td></tr>`)}},
comp:{t:'Compras y recepción',html(){return `<div class="card"><h3>Nueva orden de compra</h3><div class="frm"><label>Proveedor<select id="os" onchange="oc.sup=+this.value">${opts(db.sups.map(s=>[s.id,s.name+' ('+s.ruc+')']),oc.sup)}</select></label><label>Producto<select id="op">${popts()}</select></label><label>Cantidad<input id="oq" type="number" min="1" value="20"></label><label>Costo unit.<input id="oc" type="number" step=".01" placeholder="Según catálogo"></label><button class="btn g" onclick="addL()">Agregar línea</button></div><div id="ol" style="margin-top:10px"></div></div><div class="card" id="lst"></div>`},
 ol(){$('#ol').innerHTML=oc.lines.map((l,i)=>`<div class="ci"><div>${esc(pn(l.p))} × ${l.q} a ${M(l.c)}</div><button class="btn g sm" onclick="oc.lines.splice(${i},1);V.comp.ol()">Quitar</button></div>`).join('')+(oc.lines.length?`<button class="btn" style="margin-top:8px" onclick="mkOC()">Emitir orden de compra</button>`:'')},
 list(){$('#lst').innerHTML='<h3>Órdenes de compra</h3>'+pager('comp',db.pos.slice().reverse(),6,['N°','Proveedor','Líneas','#Total','Estado',''],o=>`<tr><td>${o.n}</td><td>${esc(db.sups[o.sup-1].name)}</td><td>${o.lines.map(l=>esc(pn(l.p))+' '+l.r+'/'+l.q).join('<br>')}</td><td class="n">${f2(o.lines.reduce((a,l)=>a+l.q*l.c,0))}</td><td><span class="bd ${o.st==='Recibida'?'ok':'wn'}">${o.st}</span></td><td>${o.st==='Recibida'?'':`<button class="btn sm" onclick="recv(${o.id})">Recibir</button>`}</td></tr>`)}},
rep:{t:'Reportes',html(){return `<div class="top noprint"><label>Desde <input id="rd" type="date" onchange="S.pg.rep=1;V.rep.list()"></label><label>Hasta <input id="rh" type="date" onchange="S.pg.rep=1;V.rep.list()"></label><button class="btn g" onclick="expS()">Excel (CSV)</button><button class="btn g" onclick="print()">PDF</button></div><div class="kp" id="rk"></div><div class="card"><h3>Ventas</h3><div id="lst"></div></div><div class="card"><h3>Valorización del inventario</h3><div class="fl"><table><tr><th>Producto</th><th class="n">Stock</th><th class="n">Costo prom.</th><th class="n">Valor</th></tr>${db.prods.slice(0,10).map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${tq(p.id)}</td><td class="n">${f2(db.avg[p.id])}</td><td class="n">${f2(tq(p.id)*db.avg[p.id])}</td></tr>`).join('')}<tr><th colspan="3">Total (${db.prods.length} productos)</th><th class="n">${f2(db.prods.reduce((a,p)=>a+tq(p.id)*db.avg[p.id],0))}</th></tr></table></div></div>`},
 rows(){const d=$('#rd').value,h=$('#rh').value;return db.sales.filter(s=>{const x=s.iso;return(!d||x>=d)&&(!h||x<=h)})},
 list(){const r=this.rows();$('#rk').innerHTML=`<div class="hero"><small>Ventas del período</small><b>${M(r.reduce((a,s)=>a+s.total,0))}</b></div><div><small>Utilidad bruta</small><b>${M(r.reduce((a,s)=>a+s.profit,0))}</b></div><div><small>Comprobantes</small><b>${r.length}</b></div>`;$('#lst').innerHTML=pager('rep',r.slice().reverse(),8,['N°','Fecha','Cliente','Pago','#Total','#Utilidad',''],s=>`<tr><td>${s.n}</td><td>${s.date}</td><td>${esc(s.cust||'Público general')}</td><td>${s.pay}</td><td class="n">${f2(s.total)}</td><td class="n">${f2(s.profit)}</td><td class="noprint"><button class="btn g sm" onclick="showTicket('${s.n}')">Reimprimir</button></td></tr>`)}},
aud:{t:'Bitácora de auditoría',html(){return `<div class="card" id="lst"></div>`},list(){$('#lst').innerHTML=pager('aud',db.log,12,['Fecha','Usuario','Acción'],l=>`<tr><td>${l.d}</td><td>${l.u}</td><td>${esc(l.a)}</td></tr>`)}}};
// ---------- Acciones
const ROLES={Administrador:['dash','pos','prod','inv','kdx','comp','rep','aud'],Almacenero:['dash','prod','inv','kdx','comp'],Cajero:['pos','rep']};
const NAMES={dash:'Panel',pos:'Punto de venta',prod:'Productos',inv:'Inventario',kdx:'Kardex',comp:'Compras',rep:'Reportes',aud:'Auditoría'};
function nav(v){if(v)S.v=v;const ok=ROLES[role];if(!ok.includes(S.v))S.v=ok[0];$('#nav').innerHTML='<h1><span>AP</span>Almacén Pro</h1>'+ok.map(k=>`<button class="${k===S.v?'on':''}" onclick="nav('${k}')">${NAMES[k]}</button>`).join('');$('#ttl').textContent=V[S.v].t;$('#main').innerHTML=V[S.v].html();V[S.v].list&&V[S.v].list();V[S.v].cart&&V[S.v].cart();V[S.v].ol&&V[S.v].ol()}
$('#role').onchange=e=>{role=e.target.value;log('Cambio de rol a '+role);nav()};$('#wsel').innerHTML=opts(db.whs.map(w=>[w.id,w.name]));$('#wsel').onchange=e=>{wh=+e.target.value;nav()};
function addC(p){const i=cart.find(x=>x.p===p);if(i)i.q++;else cart.push({p,q:1});V.pos.cart()}
function qC(p,d){const i=cart.find(x=>x.p===p);i.q+=d;if(i.q<1)cart=cart.filter(x=>x!==i);V.pos.cart()}
function calc(){const g=cart.reduce((a,i)=>a+i.q*db.prods[i.p-1].pv,0),dp=Math.min(100,Math.max(0,+($('#dc')?.value||0))),disc=g*dp/100,total=g-disc,sub=total/1.18;return{g,disc,total,sub,igv:total-sub}}
function sell(){if(!cart.length)return toast('Agrega al menos un producto');const c=calc(),cu=$('#cu').value.trim(),doc=cu.length===11?'Factura':'Boleta';if(cu&&![8,11].includes(cu.length))return toast('El DNI tiene 8 dígitos y el RUC 11');
 try{let sale;tx(()=>{const n=doc==='Factura'?'F001-'+String(db.nf++).padStart(6,'0'):'B001-'+String(db.nb++).padStart(6,'0');let cost=0;const items=cart.map(i=>{const p=db.prods[i.p-1];cost+=i.q*db.avg[p.id];move(p.id,wh,'OUT',i.q,null,n,'Venta');return{p:p.id,name:p.name,q:i.q,pv:p.pv}});
 sale={n,doc,date:now(),iso:iso(new Date()),user:role,cust:cu,items,disc:c.disc,total:c.total,sub:c.sub,igv:c.igv,pay:$('#py').value,w:wh,profit:c.sub-cost};db.sales.push(sale);log('Venta '+n+' por '+M(c.total))});
 cart=[];toast('Venta '+sale.n+' registrada');nav();showTicket(sale.n)}catch(e){toast(e.message)}}
function saveP(){const g=i=>$('#f_'+i).value,id=+g('id'),pc=+g('pc'),pv=+g('pv');if(!g('sku')||!g('n'))return toast('SKU y nombre son obligatorios');if(!(pc>0&&pv>0))return toast('Los precios deben ser mayores a 0');if(pv<pc&&!confirm('El precio de venta es menor al de compra. ¿Continuar?'))return;
 if(db.prods.some(p=>p.sku===g('sku')&&p.id!==id))return toast('Ese SKU ya existe');const f=$('#f_i').files[0],fin=img=>{const o={sku:g('sku'),bc:g('bc'),name:g('n'),cat:+g('c'),brand:g('b'),unit:g('u'),pc,pv,min:+g('mi'),max:+g('ma'),on:g('s')==='1'};if(id){Object.assign(db.prods[id-1],o);if(img)db.prods[id-1].img=img}else{o.id=db.prods.length+1;o.img=img||'';db.prods.push(o);db.avg[o.id]=pc}log((id?'Edición':'Alta')+' de producto '+o.sku);toast('Producto guardado');nav()};
 if(f){const r=new FileReader();r.onload=()=>fin(r.result);r.readAsDataURL(f)}else fin('')}
function editP(id){const p=db.prods[id-1],s=(k,v)=>$('#f_'+k).value=v;$('#pf').open=true;$('#pft').textContent='Editar '+p.sku;s('id',id);s('sku',p.sku);s('bc',p.bc);s('n',p.name);s('c',p.cat);s('b',p.brand);s('u',p.unit);s('pc',p.pc);s('pv',p.pv);s('mi',p.min);s('ma',p.max);s('s',p.on?1:0);scrollTo({top:0,behavior:'smooth'})}
function doMove(){const t=$('#mt').value,p=+$('#mp').value,q=+$('#mq').value,r=$('#mr').value.trim();if(!r)return toast('Indica el motivo del movimiento');
 try{tx(()=>{if(t==='TRF'){const d=wh===1?2:1,ex=db.lots.filter(l=>l.p===p&&l.w===wh&&l.q>0).sort((a,b)=>a.exp<b.exp?-1:1)[0];move(p,wh,'TRF-',q,null,'TRF-'+Date.now()%1e5,r);move(p,d,'TRF+',q,null,'TRF',r,ex?.lot,ex?.exp)}else move(p,wh,t,q,null,'MOV',r);log(t+' de '+q+' × '+pn(p)+' ('+r+')')});toast('Movimiento registrado');nav()}catch(e){toast(e.message)}}
function addL(){const p=+$('#op').value,q=+$('#oq').value,c=+$('#oc').value||db.prods[p-1].pc;if(!(q>0))return toast('Cantidad inválida');oc.lines.push({p,q,c,r:0});V.comp.ol()}
function mkOC(){const o={id:db.pos.length+1,n:'OC-'+String(db.pos.length+1).padStart(4,'0'),sup:oc.sup,w:wh,lines:oc.lines,st:'Pendiente'};db.pos.push(o);oc={sup:oc.sup,lines:[]};log('Orden de compra '+o.n);toast(o.n+' emitida');nav()}
function recv(id,pct){const o=db.pos.find(x=>x.id===id);pct=pct??+prompt('¿Qué porcentaje de lo pendiente se recibe? (100 = total, menor = parcial)','100');if(!(pct>0&&pct<=100))return;
 tx(()=>{o.lines.forEach(l=>{const q=Math.ceil((l.q-l.r)*pct/100);if(q>0){move(l.p,o.w,'IN',q,l.c,o.n,'Recepción de compra');l.r+=q}});o.st=o.lines.every(l=>l.r>=l.q)?'Recibida':'Parcial';log('Recepción '+o.st+' '+o.n)});toast('Recepción registrada: '+o.st);nav()}
function expK(){const T=V.kdx.rows();csv('kardex',[['Fecha','Tipo','Ref','Cant','Costo','Saldo','Valor','Usuario'],...T.map(k=>[k.d,k.type,k.ref,k.q,f2(k.c),k.bal,f2(k.val),k.user])])}
function expS(){csv('ventas',[['N°','Fecha','Cliente','Pago','Total','Utilidad'],...V.rep.rows().map(s=>[s.n,s.date,s.cust,s.pay,f2(s.total),f2(s.profit)])])}
function demo(){const p=db.prods[0],w=wh;try{tx(()=>{const o={id:db.pos.length+1,n:'OC-'+String(db.pos.length+1).padStart(4,'0'),sup:1,w,lines:[{p:1,q:20,c:3.8,r:0}],st:'Pendiente'};db.pos.push(o)});recv(db.pos.length,100);cart=[{p:1,q:3}];S.v='pos';sell();
 setTimeout(()=>{$('#dlg').close();nav('kdx');$('#kp').value=1;V.kdx.list();toast('Compra → recepción → venta → kardex de '+p.name)},1800)}catch(e){toast(e.message)}}
nav();
</script></body></html>
